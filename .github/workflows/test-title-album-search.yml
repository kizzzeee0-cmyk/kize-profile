name: Test title-only album search

on:
  push:
    branches: [main]
    paths:
      - tools/test_title_album_search.mjs
      - .github/workflows/test-title-album-search.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/test_title_album_search.mjs | tee title-search-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: title-search-report
          path: title-search-report.txt
