name: Probe Melon song search
on:
  push:
    branches: [main]
    paths:
      - tools/probe_melon_search.mjs
      - .github/workflows/probe-melon-search.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/probe_melon_search.mjs > melon-probe.txt
      - uses: actions/upload-artifact@v4
        with:
          name: melon-probe
          path: melon-probe.txt
