name: Probe Weflab cookie session

on:
  push:
    branches: [main]
    paths:
      - tools/probe_weflab_cookie.py
      - .github/workflows/probe-weflab-cookie.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/probe_weflab_cookie.py
      - uses: actions/upload-artifact@v4
        with:
          name: weflab-cookie-probe
          path: probe-report.txt
